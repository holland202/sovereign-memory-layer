name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: File hashes match the manifest
        run: |
          if command -v sha256sum >/dev/null; then sha256sum -c MANIFEST_HARDENED.sha256 --quiet; else shasum -a 256 -c MANIFEST_HARDENED.sha256 --quiet; fi
      - name: 79 tests pass and every fix-removal mutant is caught
        run: python3 verify_hardened.py
      - name: The verifier itself can fail (a fix removed must turn it red)
        run: |
          sed -i.bak 's/if me in held:  # R2-02/if False:  # R2-02/' sml/memory.py
          if python3 verify_hardened.py >/dev/null 2>&1; then echo "VERIFIER IS INERT"; exit 1; fi
          mv sml/memory.py.bak sml/memory.py
  rust-port:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"   # bit-identical embeddings need CPython >= 3.12 sum()
      - name: Rust unit and integration tests
        run: cargo test --release --manifest-path rust/Cargo.toml
      - name: ChatGPT Task 3 contract tests (both implementations)
        run: |
          python3 review/chatgpt_task3/test_contracts.py
          git checkout -- review/chatgpt_task3/raw/contracts.protocol.jsonl  # the run rewrites its own log; keep the committed evidence
      - name: SKR-001 same-key race with kill (6 of 6 as registered)
        run: python3 review/skr001_2026-11-02/skr001.py | tail -9
      - name: SKR-001 can fail (lock removed must be caught)
        run: |
          set +e
          python3 review/skr001_2026-11-02/skr001.py --sabotage > skr_sab.txt; rc=$?
          tail -3 skr_sab.txt
          [ $rc -eq 1 ] && grep -q "SABOTAGE CAUGHT" skr_sab.txt
      - name: Differential test, Python reference vs Rust port (quick)
        run: python3 tools/differential.py --quick
      - name: The differential test can fail (a sabotaged port must be caught)
        run: python3 tools/differential.py --sabotage
  ts-port:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"   # bit-identical sums need CPython >= 3.12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: TS port exp() equals glibc math.exp (SML-TS-001 P5)
        run: python3 ts/tests/exp_check.py
      - name: Differential test, Python reference vs TypeScript port (quick)
        run: python3 tools/differential.py --port ts --quick
      - name: The TS differential can fail (a sabotaged port must be caught)
        run: python3 tools/differential.py --port ts --sabotage
